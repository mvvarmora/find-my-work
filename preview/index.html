<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Find My Work — Live Interactive App Preview</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="assets/app_logo.png">
</head>
<body>

  <!-- Top Preview Header & Navigation Bar -->
  <header class="preview-header">
    <div class="brand-badge">
      <img src="assets/app_logo.png" alt="Find My Work Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
      <div class="brand-text">
        <h1>Find My Work <span>Partner App</span></h1>
        <div class="brand-sub">Android Kotlin & Jetpack Compose Interactive Live Preview</div>
      </div>
    </div>

    <div class="header-controls">
      <!-- Screen Quick Jump -->
      <div class="screen-select-wrap">
        <select id="header_screen_select" class="screen-select" onchange="fmwApp.navigate(this.value)">
          <optgroup label="Core Navigation">
            <option value="home_dashboard">🏠 Home Dashboard</option>
            <option value="available_jobs">💼 Available Jobs</option>
            <option value="active_job">⚡ Active Job Timeline</option>
            <option value="job_history">📜 Job History</option>
            <option value="earnings">💰 Earnings & Payouts</option>
            <option value="profile">👤 Worker Profile</option>
          </optgroup>
          <optgroup label="Onboarding & Auth">
            <option value="splash">✨ Splash Screen</option>
            <option value="login">🔐 Google Sign-In</option>
            <option value="complete_profile">📋 5-Step Onboarding</option>
          </optgroup>
          <optgroup label="Settings & Details">
            <option value="profile_edit">✏️ Edit Profile</option>
            <option value="payment_methods">💳 Bank & UPI Methods</option>
            <option value="notifications">🔔 Notifications</option>
            <option value="settings">⚙️ Settings</option>
          </optgroup>
        </select>
      </div>

      <!-- Action Simulation Tools -->
      <button class="btn-ctrl btn-amber" onclick="fmwStore.simulateIncomingJob(); fmwApp.showToast('🚨 Incoming Job Alert Simulated!', 'job'); if(fmwApp.currentScreen === 'available_jobs') fmwApp.renderCurrentScreen();">
        <span>⚡ Simulate Job Alert</span>
      </button>

      <!-- Viewport Toggle -->
      <button class="btn-ctrl" onclick="fmwApp.setViewMode('phone')" title="Mobile Frame">
        <span>📱 Mobile</span>
      </button>
      <button class="btn-ctrl" onclick="fmwApp.setViewMode('fullscreen')" title="Fullscreen View">
        <span>🖥️ Fullscreen</span>
      </button>

      <!-- Theme Switcher -->
      <button id="header_theme_btn" class="btn-ctrl" onclick="fmwApp.toggleTheme()">
        ☀️ Light
      </button>

      <!-- Reset Demo State -->
      <button class="btn-ctrl" style="color: #9ca3af;" onclick="if(confirm('Reset all demo data to default?')){ fmwStore.reset(); fmwApp.showToast('🔄 Demo state reset to default'); fmwApp.navigate('home_dashboard'); }">
        🔄 Reset
      </button>
    </div>
  </header>

  <!-- Preview Canvas Stage -->
  <main class="preview-stage">
    <div id="device_wrapper" class="device-wrapper">
      <div class="device-frame">
        
        <!-- Dynamic Camera Notch / Island -->
        <div class="device-notch">
          <div class="notch-sensor"></div>
          <div class="notch-camera"></div>
        </div>

        <!-- Android Status Bar -->
        <div class="status-bar">
          <div id="device_time" class="status-time">09:41</div>
          <div class="status-icons">
            <!-- 5G Icon -->
            <span style="font-size: 11px; font-weight: 800;">5G</span>
            <!-- WiFi Icon -->
            <svg viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 2.5c3.87 0 7.4 1.54 10.02 4.04L12 18.77 1.98 10.54C4.6 8.04 8.13 6.5 12 6.5z"/></svg>
            <!-- Battery Icon -->
            <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
          </div>
        </div>

        <!-- In-App Floating Toast / Notification -->
        <div id="push_toast" class="push-toast">
          <div class="push-toast-icon">⚡</div>
          <div style="flex: 1;">
            <div id="push_toast_msg" style="font-size: 12px; font-weight: 700; color: #fff;">New notification</div>
          </div>
        </div>

        <!-- Master Screen Viewport -->
        <div class="screen-container">
          <div id="screen_viewport" class="screen active">
            <!-- Dynamic Content Injected by AppController -->
          </div>
        </div>

        <!-- Persistent Bottom Navigation Bar -->
        <nav id="bottom_nav_bar" class="bottom-nav">
          <div class="nav-item active" data-screen="home_dashboard" onclick="fmwApp.navigate('home_dashboard')">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
          </div>
          
          <div class="nav-item" data-screen="available_jobs" onclick="fmwApp.navigate('available_jobs')">
            <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
            <span>Available</span>
            <span id="nav_jobs_badge" class="nav-badge" style="display: none;">0</span>
          </div>

          <div class="nav-item" data-screen="job_history" onclick="fmwApp.navigate('job_history')">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            <span>History</span>
          </div>

          <div class="nav-item" data-screen="profile" onclick="fmwApp.navigate('profile')">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Profile</span>
          </div>
        </nav>

        <!-- Device Home Indicator Pill -->
        <div class="device-home-pill"></div>

        <!-- Modal Bottom Sheet Overlay -->
        <div id="app_modal" class="modal-overlay" onclick="if(event.target === this) fmwApp.closeModal();">
          <div id="app_modal_sheet" class="modal-sheet">
            <!-- Dynamic modal content -->
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Application Logic Scripts -->
  <script src="js/state.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
