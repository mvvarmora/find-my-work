<style>
        body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        .loading-shimmer {
            position: relative;
            overflow: hidden;
        }
        
        .loading-shimmer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(182, 196, 255, 0.2), transparent);
            animation: shimmer 1.5s infinite;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scale-in {
            animation: scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-black text-on-surface h-screen flex flex-col items-center justify-between p-margin-mobile">
<!-- Top Spacer for centering -->
<div class="h-16"></div>
<!-- Centrally Placed Logo & Brand Cluster -->
<main class="flex flex-col items-center justify-center space-y-6 text-center">
<!-- App Logo Placeholder -->
<div class="scale-in">
<div class="w-24 h-24 bg-primary-container rounded-[28px] flex items-center justify-center shadow-2xl ring-1 ring-white/10 mb-4">
<span class="material-symbols-outlined text-on-primary-container !text-5xl" style="font-variation-settings: 'FILL' 1;">work</span>
</div>
</div>
<!-- App Identity -->
<div class="fade-in space-y-1" style="animation-delay: 0.2s;">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold tracking-tight">
                Find My Work
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant/80 tracking-wide uppercase">
                Your Pro Workspace
            </p>
</div>
</main>
<!-- Bottom Section: Loading Indicator -->
<footer class="w-full max-w-[200px] mb-12 flex flex-col items-center space-y-4 fade-in" style="animation-delay: 0.5s;">
<div class="w-full h-[3px] bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary loading-shimmer" style="width: 100%;"></div>
</div>
<span class="font-label-md text-label-md text-on-surface-variant/50 tracking-widest uppercase">
            Initializing
        </span>
</footer>
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 pointer-events-none z-[-1] opacity-20">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary/10 blur-[120px] rounded-full"></div>
</div>
<script>
        // Micro-interaction: Subtle parallax/float effect on the logo
        document.addEventListener('mousemove', (e) => {
            const logo = document.querySelector('.bg-primary-container');
            const x = (window.innerWidth / 2 - e.clientX) / 50;
            const y = (window.innerHeight / 2 - e.clientY) / 50;
            logo.style.transform = `translate(${x}px, ${y}px)`;
        });

        // Simulate a transition or just leave it for the splash aesthetic
        setTimeout(() => {
            console.log("Splash sequence complete. Ready for transition.");
        }, 3000);
    </script>
