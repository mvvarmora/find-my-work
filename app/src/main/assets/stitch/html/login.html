<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                let ripple = document.createElement('div');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // Simple validation visualization
        const phoneInput = document.querySelector('input[type="tel"]');
        phoneInput.addEventListener('input', (e) => {
            const val = e.target.value.replace(/\D/g, '');
            if(val.length > 0) {
                e.target.parentElement.classList.add('border-primary');
                e.target.parentElement.classList.remove('border-white/8');
            } else {
                e.target.parentElement.classList.remove('border-primary');
                e.target.parentElement.classList.add('border-white/8');
            }
        });
    </script>
<style>
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
            border-radius: 50%;
            animation: ripples 0.6s linear;
        }
        @keyframes ripples {
            0% { width: 0px; height: 0px; opacity: 0.5; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }
    </style>
